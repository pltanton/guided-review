name: site

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild guided-review-site at this commit
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          gh api repos/pltanton/guided-review-site/dispatches \
            -f event_type=gr-release -f "client_payload[ref]=${{ github.sha }}"
